name: CI

on:
  push:
  pull_request:

jobs:
  booking-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: booking-service/pom.xml
      - run: mvn -B verify

  message-sender:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: message-sender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: message-sender/pom.xml
      - run: mvn -B verify

  booking-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: booking-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: booking-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-images:
    runs-on: ubuntu-latest
    needs: [booking-service, message-sender]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
